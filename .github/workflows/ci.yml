name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install LuaJIT for cross-language identity vectors
        run: sudo apt-get update && sudo apt-get install --yes luajit

      - name: Install
        run: bun install --frozen-lockfile --ignore-scripts

      # Dev-toolchain advisories with no shipping impact and, for PostCSS, no
      # patched release yet — 8.5.23 still carries GHSA-r28c-9q8g-f849. Every one
      # is a devDependency of the test toolchain; the published package `files`
      # allowlist is source, dist, contract and docs, so none of this reaches a
      # consumer.
      #
      # Accepted by exact advisory id rather than by lowering --audit-level or
      # dropping the step, so a NEW advisory still fails the build. Revisit when
      # PostCSS and Vitest ship fixes; removing an id here should make CI red
      # again if it is still unpatched.
      # GHSA-r28c-9q8g-f849 — postcss: path traversal via sourceMappingURL; no patched release
      - name: Audit dependencies
        run: |
          bun audit --ignore=GHSA-r28c-9q8g-f849

      - name: Typecheck, test, and verify committed output
        run: bun run check
